<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điểm sinh viên</title>
    <link rel="stylesheet" href="1_1.css">
</head>
<body>
    <div class="container">
        <h2>Quản lý điểm sinh viên</h2>
        <div class="input-group">
            <input type="text" id="Name" placeholder="Họ tên">
            <input type="number" id="Score" placeholder="Điểm" min="0" max="10" step="0.1">
            <button id="btnAdd">Thêm</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Họ tên</th>
                    <th>Điểm</th>
                    <th>Xếp loại</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>
        <div class="stats" id="statsArea">
            Tổng số sinh viên: 0 | Điểm trung bình: 0
        </div>
    </div>
    <script src="1_1.js"></script>
</body>
</html>
