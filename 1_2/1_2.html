<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điểm sinh viên</title>
    <link rel="stylesheet" href="1_2.css">
</head>
<body>
    <div class="container">
        <h2>Quản lý điểm sinh viên</h2>
        <div class="input-group">
            <input type="text" id="Name" placeholder="Họ tên">
            <input type="number" id="Score" placeholder="Điểm" min="0" max="10" step="0.1">
            <button id="btnAdd">Thêm</button>
        </div>
        <hr>
        <div class="filter-group">
            <input type="text" id="searchName" placeholder="Tìm tên sinh viên...">
            
            <select id="filterRank">
                <option value="all">Tất cả xếp loại</option>
                <option value="Giỏi">Giỏi</option>
                <option value="Khá">Khá</option>
                <option value="Trung bình">Trung bình</option>
                <option value="Yếu">Yếu</option>
            </select>
        </div>
        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Họ tên</th>
                    <th id="sortScore" style="cursor:pointer">Điểm <span id="sortIcon">↕</span></th>
                    <th>Xếp loại</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>
        <div class="stats" id="statsArea">
            Tổng số sinh viên: 0 | Điểm trung bình: 0
        </div>
    </div>
    <script src="1_2.js"></script>
</body>
</html>
