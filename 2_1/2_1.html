<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="2_1.css">
</head>
<body>
    <div class="container">
    <form id="registrationForm">
        <h2>Đăng Ký Tài Khoản</h2>

        <div class="form-control">
            <label>Họ và tên</label>
            <input type="text" id="fullname" placeholder="Nhập ít nhất 3 ký tự...">
            <span class="error" id="fullnameError"></span>
        </div>

        <div class="form-control">
            <label>Email</label>
            <input type="text" id="email" placeholder="name@domain.com">
            <span class="error" id="emailError"></span>
        </div>

        <div class="form-control">
            <label>Số điện thoại</label>
            <input type="text" id="phone" placeholder="0xxxxxxxxx">
            <span class="error" id="phoneError"></span>
        </div>

        <div class="form-control">
            <label>Mật khẩu</label>
            <input type="password" id="password" placeholder="Tối thiểu 8 ký tự, 1 hoa, 1 thường, 1 số">
            <span class="error" id="passwordError"></span>
        </div>

        <div class="form-control">
            <label>Xác nhận mật khẩu</label>
            <input type="password" id="confirmPassword">
            <span class="error" id="confirmPasswordError"></span>
        </div>

        <div class="form-control">
            <label>Giới tính:</label>
            <div class="radio-group">
                <input type="radio" name="gender" value="Nam"> Nam
                <input type="radio" name="gender" value="Nữ"> Nữ
            </div>
            <span class="error" id="genderError"></span>
        </div>

        <div class="form-control">
            <input type="checkbox" id="terms"> Tôi đồng ý với điều khoản
            <span class="error" id="termsError"></span>
        </div>

        <button type="submit">Đăng Ký</button>
    </form>
    <div id="successMessage" style="display:none; text-align:center;"></div>
    </div>
    <script src="2_1.js"></script>
</body>
</html>
